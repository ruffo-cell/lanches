<#include "layouts/header.html">

<style>
    /* Estilo Dark Mode igual ao resto do site */
    body {
        background-color: #1a1a1a;
        color: white;
        font-family: 'Segoe UI', sans-serif;
    }

    .caixa-pedido {
        background-color: #2c2c2c;
        border: 1px solid #444;
        border-radius: 10px;
        padding: 40px;
        max-width: 600px;
        margin: 40px auto;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    h2 {
        color: #ffb74d;
        text-align: center;
        border-bottom: 2px solid #ffb74d;
        padding-bottom: 10px;
        display: inline-block;
        margin-bottom: 30px;
    }

    /* Estilo dos inputs do formulário */
    .form-label {
        color: #ffb74d;
        font-weight: bold;
    }

    .form-control, .form-select {
        background-color: #1a1a1a;
        border: 1px solid #444;
        color: white;
    }

    .form-control:focus, .form-select:focus {
        background-color: #333;
        color: white;
        border-color: #ffb74d;
        box-shadow: 0 0 5px rgba(255, 183, 77, 0.5);
    }

    /* Botão do WhatsApp */
    .btn-whatsapp {
        background-color: #25D366; /* Verde oficial do WhatsApp */
        color: white;
        font-weight: bold;
        width: 100%;
        padding: 15px;
        font-size: 1.2rem;
        border: none;
        border-radius: 5px;
        margin-top: 20px;
        transition: 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .btn-whatsapp:hover {
        background-color: #128C7E;
        color: white;
        box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
    }
</style>

<div class="container">
    <div class="caixa-pedido">
        <div class="text-center">
            <h2>Finalizar Pedido</h2>
            <p style="color: #ccc;">Preencha seus dados para enviar o pedido no nosso WhatsApp.</p>
        </div>

        <form onsubmit="enviarZap(event)">

            <div class="mb-3">
                <label for="nome" class="form-label">Seu Nome:</label>
                <input type="text" class="form-control" id="nome" placeholder="Ex: João da Silva" required>
            </div>

            <div class="mb-3">
                <label for="lanche" class="form-label">Seu Pedido:</label>
                <textarea class="form-control" id="lanche" rows="3" placeholder="Ex: 1 X-Tudo sem cebola..." required></textarea>
            </div>

            <div class="mb-3">
                <label for="endereco" class="form-label">Endereço de Entrega:</label>
                <input type="text" class="form-control" id="endereco" placeholder="Rua, Número e Bairro" required>
            </div>

            <div class="mb-3">
                <label for="pagamento" class="form-label">Forma de Pagamento:</label>
                <select class="form-select" id="pagamento">
                    <option value="Pix">Pix</option>
                    <option value="Cartão de Crédito">Cartão de Crédito (Maquininha)</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Dinheiro">Dinheiro (Precisa de troco?)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-whatsapp">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-whatsapp" viewBox="0 0 16 16">
                    <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592z"/>
                </svg>
                Enviar Pedido no Zap
            </button>
        </form>
    </div>
</div>

<script>
    // 1. FUNÇÃO PARA PEGAR O LANCHE AUTOMÁTICO DA URL
    // Se o cliente veio do cardápio clicando em "X-Bacon", o campo já vem preenchido.
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const item = urlParams.get('item'); // Pega o que está depois de ?item=

        if(item) {
            // Formata o texto (troca traços por espaços e deixa maiúsculo)
            let lancheFormatado = item.replace(/-/g, ' ').toUpperCase();
            document.getElementById('lanche').value = "Eu quero um: " + lancheFormatado;
        }
    }

    // 2. FUNÇÃO QUE ENVIA PARA O WHATSAPP
    function enviarZap(event) {
        event.preventDefault(); // Impede a página de recarregar
        console.log("pedido")

        // Pega os dados que o cliente digitou
        let nome = document.getElementById('nome').value;
        let lanche = document.getElementById('lanche').value;
        let endereco = document.getElementById('endereco').value;
        let pagamento = document.getElementById('pagamento').value;

        // --- CONFIGURE SEU NÚMERO AQUI (Apenas números, com DDD) ---
        let numeroTelefone = "5521988401272";

        // Monta a mensagem (o \n serve para pular linha)
        let mensagem = `*NOVO PEDIDO DO SITE!* 🍔\n\n` +
            `*Nome:* ${nome}\n` +
            `*Pedido:* ${lanche}\n` +
            `*Endereço:* ${endereco}\n` +
            `*Pagamento:* ${pagamento}`;

        // Transforma a mensagem em um link especial
        let url = `https://wa.me/${numeroTelefone}?text=${encodeURIComponent(mensagem)}`;
console.log(url)
        // Abre o WhatsApp numa nova aba
        window.open(url, '_blank');
    }
</script>

<#include "layouts/footer.html">
