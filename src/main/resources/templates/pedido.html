<#include "layouts/header.html">

<style>
    body {
        background-color: #1a1a1a;
        color: white;
        font-family: sans-serif;
    }

    .container-pedido {
        display: flex;
        justify-content: center;
        padding: 40px 20px;
        min-height: 60vh;
    }

    .caixa-formulario {
        background-color: #2c2c2c;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        width: 100%;
        max-width: 500px;
        border: 1px solid #444;
    }

    .grupo-input { margin-bottom: 15px; }
    .grupo-input label { display: block; color: #ffb74d; margin-bottom: 5px; font-weight: bold; }

    .form-control {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #555;
        background-color: #1a1a1a;
        color: white;
        font-size: 16px;
        box-sizing: border-box;
    }

    .btn-zap-final {
        background-color: #25D366;
        color: white;
        width: 100%;
        padding: 15px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }
    .btn-zap-final:hover { background-color: #128C7E; }
</style>

<div class="container-pedido">
    <div class="caixa-formulario">
        <h2 style="text-align: center; color: #25D366;">🚀 Finalizar Pedido</h2>
        <p style="text-align: center; color: #ccc;">Preencha para enviar no WhatsApp</p>

        <form id="form-zap">
            <div class="grupo-input">
                <label>Seu Nome:</label>
                <input type="text" id="nome" class="form-control" placeholder="Seu nome" required>
            </div>

            <div class="grupo-input">
                <label>Seu Pedido:</label>
                <textarea id="pedido" class="form-control" rows="3" placeholder="Seu pedido..." required></textarea>
            </div>

            <div class="grupo-input">
                <label>Endereço:</label>
                <input type="text" id="endereco" class="form-control" placeholder="Rua, número e bairro" required>
            </div>

            <div class="grupo-input">
                <label>Pagamento:</label>
                <select id="pagamento" class="form-control">
                    <option value="Pix">Pix</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                </select>
            </div>

            <button type="button" onclick="dispararWhatsapp()" class="btn-zap-final">
                ENVIAR PEDIDO AGORA
            </button>
        </form>
    </div>
</div>

<script>
    window.onload = function () {
        const urlParams = new URLSearchParams(window.location.search);
        const item = urlParams.get('item');
        if (item) {
            document.getElementById('pedido').value =
                "1x " + item.replace(/-/g, ' ').toUpperCase();
        }
    };

    function dispararWhatsapp() {
        const nome = document.getElementById('nome').value.trim();
        const pedido = document.getElementById('pedido').value.trim();
        const endereco = document.getElementById('endereco').value.trim();
        const pagamento = document.getElementById('pagamento').value;

        if (!nome || !pedido || !endereco) {
            alert("⚠️ Preencha Nome, Pedido e Endereço!");
            return;
        }

        const numero = "5521988401272";

        const mensagem =
            "*NOVO PEDIDO* 🍔\n\n" +
            "*Nome:* " + nome + "\n" +
            "*Pedido:* " + pedido + "\n" +
            "*Endereço:* " + endereco + "\n" +
            "*Pagamento:* " + pagamento;

        const texto = encodeURIComponent(mensagem);

        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (isMobile) {
            window.location.href =
                "whatsapp://send?phone=" + numero + "&text=" + texto;
        } else {
            window.open(
                "https://web.whatsapp.com/send?phone=" + numero + "&text=" + texto,
                "_blank"
            );
        }
    }
</script>


<#include "layouts/footer.html">
